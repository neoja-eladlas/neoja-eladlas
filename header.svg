<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="spot" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#4a4e55"/>
      <stop offset="0.45" stop-color="#1c1e22"/>
      <stop offset="1" stop-color="#050607"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.18" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#d9dce0"/>
      <stop offset="0.5" stop-color="#7d838b"/>
      <stop offset="0.62" stop-color="#c9ccd1"/>
      <stop offset="1" stop-color="#f4f5f6"/>
    </linearGradient>
    <linearGradient id="chromeSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eaed"/>
      <stop offset="1" stop-color="#9aa0a6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8eaed"/>
      <stop offset="1" stop-color="#9aa0a6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <pattern id="folds" width="46" height="320" patternUnits="userSpaceOnUse">
      <rect width="46" height="320" fill="#000" opacity="0"/>
      <rect x="0" width="10" height="320" fill="#000" opacity="0.12"/>
      <rect x="30" width="6" height="320" fill="#fff" opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#spot)"/>
  <rect width="1200" height="320" fill="url(#folds)"/>
  <rect width="1200" height="320" fill="url(#curtain)"/>

  <text x="600" y="168" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
        font-weight="900" font-size="96" letter-spacing="6" fill="url(#chrome)"
        stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" filter="url(#shadow)">ELAD LASTER</text>

  <rect x="350" y="198" width="500" height="2" fill="url(#line)"/>

    <text x="600" y="246" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-weight="600" font-size="30" letter-spacing="6" fill="url(#chromeSoft)">SOFTWARE DEVELOPER</text>

  <text x="600" y="284" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-weight="500" font-size="18" letter-spacing="3" fill="#8e949b">UNITY · FULL STACK · AI-ASSISTED DEVELOPMENT</text>
</svg>
